<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sophie Smashes Golf 16-Bit - Warragul Country Club</title>
  <meta name="description" content="A 16-bit Hybrid Arcade Golf Game featuring Top-Down Strategy View and Side-View Swing Overlay at Warragul Country Club.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div id="app" class="retro-container">
    
    <!-- VIEW 1: TOP-DOWN STRATEGY VIEW (Full Screen Canvas Area) -->
    <div id="game-view" class="game-viewport">
      <canvas id="game-canvas" width="960" height="720"></canvas>
      <div id="crt-overlay" class="crt-filter"></div>

      <!-- Top Overlay HUD Bar -->
      <header id="hud-header" class="snes-hud-top overlay-hud-top">
        <div class="hud-item hole-badge">
          <span class="hud-label">HOLE</span>
          <span id="hud-hole-num" class="hud-value">1</span>
        </div>
        <div class="hud-item par-badge">
          <span class="hud-label">PAR</span>
          <span id="hud-par-val" class="hud-value">4</span>
        </div>
        <div class="hud-item dist-badge">
          <span class="hud-label">DISTANCE</span>
          <span id="hud-dist-val" class="hud-value">307m</span>
        </div>
        <div class="hud-item score-badge">
          <span class="hud-label">SCORE</span>
          <span id="hud-score-val" class="hud-value">EVEN</span>
        </div>
        <div class="hud-item wind-badge">
          <span class="hud-label">WIND</span>
          <div id="hud-wind-container">
            <span id="hud-wind-arrow">↑</span>
            <span id="hud-wind-val" class="hud-value">8 MPH</span>
          </div>
        </div>
      </header>

      <!-- In-Game Arcade Overlay Banner -->
      <div id="game-banner" class="game-banner hidden">
        <div id="banner-text" class="banner-title">HOLE 1: WARRAGUL COUNTRY CLUB</div>
        <div id="banner-subtext" class="banner-subtitle">AIM YOUR SHOT & SELECT CLUB</div>
      </div>

      <!-- Shot Result Popup -->
      <div id="shot-popup" class="shot-popup hidden">
        <span id="shot-result-text">PERFECT SNAP!</span>
      </div>
    </div>

    <!-- Bottom Strategy Controls Bar (Aim & Club Selection) -->
    <footer id="hud-footer" class="snes-hud-bottom strategy-hud-bottom">
      <div class="hud-control-group club-select-box">
        <button id="btn-club-prev" class="retro-btn" title="Previous Club (Up Key)">▲</button>
        <div class="club-display">
          <span class="hud-label">CLUB</span>
          <span id="hud-club-name" class="hud-value text-gold">DRIVER</span>
          <span id="hud-club-dist" class="hud-subvalue">220m</span>
        </div>
        <button id="btn-club-next" class="retro-btn" title="Next Club (Down Key)">▼</button>
      </div>

      <!-- Aim Direction Controls -->
      <div class="aim-controls">
        <button id="btn-aim-left" class="retro-btn btn-large" title="Aim Left (Left Arrow)">◀ AIM LEFT</button>
        <button id="btn-aim-right" class="retro-btn btn-large" title="Aim Right (Right Arrow)">AIM RIGHT ▶</button>
      </div>

      <!-- SWING / READY BUTTON (Triggers Side-View Swing Overlay) -->
      <div class="swing-trigger-box">
        <button id="btn-open-swing" class="retro-btn btn-swing-highlight">SWING [SPACEBAR]</button>
      </div>

      <!-- Option Buttons & Hole Selector -->
      <div class="hud-control-group action-controls">
        <div class="hole-selector">
          <span class="hud-label">WARRAGUL CC</span>
          <select id="select-hole" class="retro-select">
            <option value="1">Hole 1 - 307m (Par 4)</option>
            <option value="2">Hole 2 - 334m (Par 4)</option>
            <option value="3">Hole 3 - 345m (Par 4)</option>
            <option value="4">Hole 4 - 265m (Par 4)</option>
            <option value="5">Hole 5 - 305m (Par 4)</option>
            <option value="6">Hole 6 - 240m (Par 4)</option>
            <option value="7">Hole 7 - 175m (Par 3)</option>
            <option value="8">Hole 8 - 429m (Par 5)</option>
            <option value="9">Hole 9 - 289m (Par 4)</option>
          </select>
        </div>
        <div class="toggle-buttons">
          <button id="btn-map-toggle" class="retro-btn btn-small" title="Toggle Full Course Overview Mode (Key M)">FULL MAP</button>
          <button id="btn-crt-toggle" class="retro-btn btn-small active" title="Toggle CRT Filter">CRT</button>
          <button id="btn-audio-toggle" class="retro-btn btn-small active" title="Toggle Sound">SFX ON</button>
          <button id="btn-reset-shot" class="retro-btn btn-small" title="Mulligan / Reset Shot">RESET</button>
        </div>
      </div>
    </footer>

    <!-- VIEW 2: SIDE-VIEW SWING OVERLAY (Pop-Up Swing Stage) -->
    <div id="swing-modal" class="swing-modal-overlay hidden">
      <div class="swing-modal-container">
        <div class="modal-header">
          <span class="modal-title">SOPHIE SMASHES SWING STAGE</span>
          <button id="btn-close-swing" class="retro-btn btn-close-modal" title="Return to Strategy View">BACK TO MAP [ESC]</button>
        </div>
        
        <!-- Side View Stage Canvas -->
        <div class="modal-stage-wrapper">
          <canvas id="swing-canvas" width="640" height="360"></canvas>
        </div>

        <!-- Links LS 98 3-Click Swing Power & Snap Gauge inside Modal -->
        <div class="modal-swing-meter-container">
          <div class="meter-labels">
            <span class="text-green">SNAP (0%)</span>
            <span>POWER 50%</span>
            <span class="text-gold">100% POWER</span>
          </div>
          <div id="modal-meter-bar-track" class="meter-bar-track">
            <div id="modal-meter-sweet-spot" class="meter-sweet-spot"></div>
            <div id="modal-meter-fill" class="meter-power-fill"></div>
            <div id="modal-meter-cursor" class="meter-cursor"></div>
          </div>
          <div class="meter-action-hint">
            <span id="modal-status-text">CLICK SPACE / TAP TO START POWER GAUGE</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
